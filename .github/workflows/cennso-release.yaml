name: Cennso Release of nettools

on:
  workflow_dispatch:

jobs:
  push-to-cur:
    name: "cur-release"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: v2026.9.12
          install: true
          cache: true
          experimental: true
          # log_level: debug
          github_token: "${{ secrets.GOVERNANCE_GITHUB_TOKEN }}"
      - name: Login to Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.CUR_REGISTRY_DOMAIN }}
          username: ${{ secrets.CUR_REGISTRY_USERNAME }}
          password: ${{ secrets.CUR_REGISTRY_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ secrets.CUR_REGISTRY_DOMAIN }}/${{ secrets.CUR_PROJECT_NAME }}
          tags: |
            type=semver,pattern={{raw}}
          flavor: |
            latest=false
            prefix=
            suffix=
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
